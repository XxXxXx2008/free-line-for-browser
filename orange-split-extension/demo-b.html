    <title>网页 B · 示例</title>

  <body class="demo-b">
    <main class="demo-shell">

        <span class="demo-card-label">快捷键</span>
        <strong>方向键移动橙线</strong>
        <p>聚焦中央小点后，可用 Shift + 方向键调整角度。</p>
      </div>
      <div class="demo-decoration decoration-b" aria-hidden="true"></div>
